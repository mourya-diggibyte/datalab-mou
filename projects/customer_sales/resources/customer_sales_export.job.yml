# Python-file lane: scheduled, headless export of gold to the export volume
# (spark_python_task). Reads pipeline-owned tables READ-ONLY (single-writer
# invariant) — see AGENTS.md "Authoring rules".
#
# Reuses the pipeline's exact dependency mechanism: a serverless environment
# installing the framework wheel from THIS project's catalog volume
# customer_sales.artifacts.wheels (${var.datalab_wheel}) plus this domain's wheel —
# same caching gotcha (see AGENTS.md "Wheel delivery").

resources:
  jobs:
    customer_sales_export:
      name: customer_sales_export

      trigger:
        # Weekly snapshot; paused automatically in dev (mode: development).
        periodic:
          interval: 1
          unit: WEEKS

      # Bundle variables → job parameters → task argv. Zero hardcoding.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: gold_schema
          default: ${var.gold_schema}
        - name: export_path
          default: ${var.sales_export_path}

      environments:
        - environment_key: datalab
          spec:
            environment_version: "4"
            dependencies:
              # datalab FRAMEWORK wheel from THIS project's catalog volume
              # customer_sales.artifacts.wheels (make publish-wheel; CI publishes
              # before deploy). Serverless doesn't honor --editable installs of synced files.
              - ${var.datalab_wheel}
              # This domain's wheel — built by the customer_sales_etl_wheel artifact.
              - ../../../dist/customer_sales_etl-*.whl

      tasks:
        - task_key: export_customer_summary
          environment_key: datalab
          spark_python_task:
            python_file: ../src/jobs/customer_sales/export_customer_summary.py
            parameters:
              - "--catalog"
              - "{{job.parameters.catalog}}"
              - "--gold-schema"
              - "{{job.parameters.gold_schema}}"
              - "--export-path"
              - "{{job.parameters.export_path}}"

      queue:
        enabled: true

      permissions: ${var.job_permissions}
