# Notebook lane: on-demand, human-gated quarantine triage (notebook_task,
# deliberately NO trigger) — see AGENTS.md "Authoring rules". Run with:
#   databricks bundle run customer_sales_quarantine_report -t dev
#
# Reads pipeline-owned tables READ-ONLY; writes only the report table it owns
# (single-writer invariant).

resources:
  jobs:
    customer_sales_quarantine_report:
      name: customer_sales_quarantine_report

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: silver_schema
          default: ${var.silver_schema}

      environments:
        - environment_key: datalab
          spec:
            environment_version: "4"
            dependencies:
              # datalab FRAMEWORK wheel from THIS project's catalog volume
              # customer_sales.artifacts.wheels (make publish-wheel; CI publishes
              # before deploy). Serverless doesn't honor --editable installs of synced files.
              - ${var.datalab_wheel}
              # This domain's wheel — built by the customer_sales_etl_wheel artifact.
              - ../../../dist/customer_sales_etl-*.whl

      tasks:
        - task_key: quarantine_report
          environment_key: datalab
          notebook_task:
            notebook_path: ../notebooks/customer_sales/quarantine_report.py
            base_parameters:
              # widget name == job parameter name — the lane's contract,
              # resolved in the notebook via datalab.params.notebook_params.
              catalog: "{{job.parameters.catalog}}"
              silver_schema: "{{job.parameters.silver_schema}}"

      queue:
        enabled: true

      permissions: ${var.job_permissions}
