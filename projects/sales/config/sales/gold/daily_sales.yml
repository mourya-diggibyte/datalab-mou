# yaml-language-server: $schema=../../../../../schemas/table_config.schema.json
#
# Target table: gold.daily_sales — business aggregate (batch MV): per-day order
# count, recognized revenue and average order value. The transform produces the
# final shape, so there is no columns: mapping (see docs/FRAMEWORK.md).
schema_version: 1
name: daily_sales
comment: Per-day order count, recognized revenue and average order value.
source:
  kind: table
  name: orders
  layer: silver
transform:
  - function: sales.daily_sales
target:
  kind: materialized_view
