# design/estate.yml - what the diagrams need that no bundle YAML states.
#
# The design/*.drawio files are GENERATED by scripts/design_diagram.py from
# config/, resources/*.yml, targets/, .github/workflows/ and this file
# (`make design`; `make check-design` fails CI when they drift). Declare here
# only relationships the code cannot express: source systems upstream of the
# landing volume, consumers downstream of the gold layer, and what an edge job
# reads and writes. Tables are referenced as <domain>.<layer>.<table>
# (quarantine tables too); an unknown reference fails the generator.
#
# Optional keys:
#   title: <string>                 # page title prefix (default: bundle name)
#   sources:   [{name, detail?, logo?, feeds: [<domain>.<layer>.<table>]}]
#   consumers: [{name, detail?, logo?, reads: [<domain>.<layer>.<table>]}]
#   jobs:      {<job resource key>: {reads: [...], writes: <string>}}
# `logo` is a key of the kit's mark pack (scripts/drawio_kit/assets/logos.json,
# e.g. dashboards, genie, mlflow, aws_s3); unknown keys draw no logo.

jobs:
  customer_sales_export:
    reads: [customer_sales.gold.customers_by_city]
    writes: CSV snapshot to the export volume (var.sales_export_path)
  customer_sales_quarantine_report:
    reads: [customer_sales.silver.customers_quarantine]
    writes: customers_quarantine_report table (notebook-owned)

consumers:
  - name: Analysts and BI readers
    logo: dashboards
    detail: consume the gold layer (SELECT via Unity Catalog grants)
    reads: [customer_sales.gold.customers_by_city]
  - name: Data steward
    detail: triages quarantined rows with the on-demand quarantine report
    reads: [customer_sales.silver.customers_quarantine]
